<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Закладка</title>
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; background: transparent; }
  /* ---------- sidebar ---------- */
  aside {
    width: 220px; flex: none; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 52px 10px 10px;
    -webkit-app-region: drag;
  }
  .side-title { font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; padding: 0 8px 6px; }
  .plist { flex: 1; overflow-y: auto; -webkit-app-region: no-drag; }
  .pitem {
    display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; margin-bottom: 1px;
  }
  .pitem:hover { background: var(--hover); }
  .pitem.on { background: var(--active); font-weight: 500; }
  .pitem .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .count { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pitem .stale { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); opacity: .7; }
  .side-btn { -webkit-app-region: no-drag; text-align: left; padding: 6px 8px; border-radius: 7px; color: var(--muted); }
  .side-btn:hover { background: var(--hover); color: var(--text); }
  .side-foot { -webkit-app-region: no-drag; padding: 8px; color: var(--faint); font-size: 11px; border-top: 1px solid var(--line); margin-top: 6px; }

  /* ---------- main ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-solid); }
  header {
    display: flex; align-items: center; gap: 12px; padding: 18px 24px 14px; -webkit-app-region: drag;
  }
  header .dot { width: 14px; height: 14px; -webkit-app-region: no-drag; }
  header h1 { font-size: 20px; font-weight: 650; flex: 1; outline: 0; -webkit-app-region: no-drag; min-width: 40px; border-radius: 6px; padding: 0 4px; margin-left: -4px; }
  header h1[contenteditable="true"] { background: var(--hover); user-select: text; }
  .btn {
    -webkit-app-region: no-drag; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--text); color: var(--bg-solid); border-color: transparent; }
  .btn.primary:hover { opacity: .88; }
  .icon-btn { -webkit-app-region: no-drag; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); font-size: 16px; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  .scroll { flex: 1; overflow-y: auto; padding: 0 24px 16px; }

  .status {
    border-radius: 12px; padding: 12px 14px 10px; margin-bottom: 18px;
    background: color-mix(in srgb, var(--pc) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--pc) 22%, transparent);
  }
  .status-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: color-mix(in srgb, var(--pc) 75%, var(--text)); display: flex; justify-content: space-between; }
  .status-label span { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--faint); }
  .status textarea {
    width: 100%; border: 0; outline: 0; background: transparent; resize: none; font-size: 15px; line-height: 1.5;
    padding: 6px 0 2px; min-height: 30px; user-select: text;
  }
  .status textarea::placeholder { color: var(--faint); }

  .toolbar { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .seg { padding: 4px 10px; border-radius: 7px; color: var(--muted); font-size: 12px; }
  .seg:hover { background: var(--hover); }
  .seg.on { background: var(--active); color: var(--text); font-weight: 500; }
  .seg i { font-style: normal; color: var(--faint); margin-left: 3px; font-variant-numeric: tabular-nums; }
  .toolbar .grow { flex: 1; }
  .toggle { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  .entry {
    display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px; border-radius: 8px; margin: 0 -8px;
  }
  .entry:hover { background: var(--hover); }
  .mark {
    flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%;
    border: 1.5px solid var(--faint); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted);
  }
  .mark.idea { border-radius: 5px; font-size: 9px; color: var(--faint); }
  .mark.question { border-style: dashed; }
  .entry.done .mark { background: var(--pc); border-color: var(--pc); border-style: solid; color: #fff; }
  .entry .text { flex: 1; min-width: 0; outline: 0; word-wrap: break-word; white-space: pre-wrap; }
  .entry .text[contenteditable="true"] { user-select: text; background: var(--panel); border-radius: 4px; box-shadow: 0 0 0 4px var(--panel); }
  .entry.done .text { color: var(--faint); text-decoration: line-through; }
  .entry .tag { font-size: 11px; color: var(--faint); flex: none; margin-top: 2px; }
  .entry .time { font-size: 11px; color: var(--faint); flex: none; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .entry .del { opacity: 0; color: var(--faint); width: 20px; flex: none; font-size: 15px; line-height: 1; }
  .entry:hover .del { opacity: 1; }
  .entry .del:hover { color: #E5484D; }
  .empty { color: var(--faint); padding: 28px 0; text-align: center; }

  .composer {
    display: flex; align-items: center; gap: 8px; margin: 0 24px 18px; padding: 6px 6px 6px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  }
  .composer input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; padding: 6px 0; user-select: text; }
  .composer input::placeholder { color: var(--faint); }
  .composer select {
    border: 0; outline: 0; background: var(--hover); border-radius: 7px; padding: 5px 8px; font: inherit; color: var(--muted);
  }

  .toast {
    position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 10px); opacity: 0;
    background: var(--text); color: var(--bg-solid); padding: 8px 14px; border-radius: 9px; font-weight: 500;
    transition: .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .palette { position: absolute; display: none; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); z-index: 5; -webkit-app-region: no-drag; }
  .palette.show { display: flex; }
  .palette button { width: 18px; height: 18px; border-radius: 50%; }
  .palette button:hover { transform: scale(1.15); }

  .menu { position: absolute; right: 24px; top: 54px; display: none; flex-direction: column; min-width: 190px; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); z-index: 5; }
  .menu.show { display: flex; }
  .menu button { text-align: left; padding: 6px 10px; border-radius: 6px; }
  .menu button:hover { background: var(--hover); }
  .menu .danger { color: #E5484D; }
</style>
</head>
<body>
<aside>
  <div class="side-title">Проекты</div>
  <div class="plist" id="plist"></div>
  <button class="side-btn" id="addProject">＋ Проект</button>
  <div class="side-foot">Быстрая запись — <span class="kbd" id="hotkey">⌘⇧Space</span></div>
</aside>
<main id="main">
  <header>
    <button class="dot" id="pdot" title="Цвет"></button>
    <h1 id="pname" title="Дважды кликни, чтобы переименовать"></h1>
    <button class="btn primary" id="export" title="Скопирует контекст проекта в буфер — вставь в новый чат с Claude">Скопировать для Claude</button>
    <button class="icon-btn" id="more">⋯</button>
  </header>
  <div class="menu" id="menu">
    <button data-a="rename">Переименовать</button>
    <button data-a="up">Выше в списке</button>
    <button data-a="down">Ниже в списке</button>
    <button data-a="delete" class="danger">Удалить проект…</button>
  </div>
  <div class="palette" id="palette"></div>
  <div class="scroll">
    <div class="status" id="status">
      <div class="status-label">Где я остановилась <span id="statusTime"></span></div>
      <textarea id="statusText" rows="1" placeholder="Что сделано, на чём застряла, какой следующий шаг…"></textarea>
    </div>
    <div class="toolbar" id="toolbar"></div>
    <div id="entries"></div>
  </div>
  <div class="composer">
    <input id="newText" placeholder="Новая запись…  Enter — добавить">
    <select id="newType">
      <option value="task">Задача</option>
      <option value="idea">Идея</option>
      <option value="question">Вопрос</option>
    </select>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TYPE = { task: { label: 'Задачи', one: 'задача', mark: '' }, idea: { label: 'Идеи', one: 'идея', mark: '✦' }, question: { label: 'Вопросы', one: 'вопрос', mark: '?' } };
let data, colors = [], current = null, filter = 'all', showDone = false;

function ago(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return `${m} мин назад`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} ч назад`;
  const d = Math.round(h / 24);
  return d === 1 ? 'вчера' : `${d} дн назад`;
}
function shortTime(ts) {
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toTimeString().slice(0, 5);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}
const proj = () => data.projects.find(p => p.id === current);

function renderSide() {
  $('plist').innerHTML = data.projects.map(p => {
    const open = data.entries.filter(e => e.projectId === p.id && !e.done && e.type === 'task').length;
    const stale = p.statusUpdated && Date.now() - p.statusUpdated > 7 * 864e5;
    return `<div class="pitem ${p.id === current ? 'on' : ''}" data-id="${p.id}">
      <span class="dot" style="background:${p.color}"></span>
      <span class="name">${esc(p.name)}</span>
      ${stale ? '<span class="stale" title="Статус не обновлялся больше недели"></span>' : ''}
      ${open ? `<span class="count">${open}</span>` : ''}
    </div>`;
  }).join('');
}

function renderMain() {
  const p = proj();
  $('main').style.visibility = p ? 'visible' : 'hidden';
  if (!p) return;
  document.documentElement.style.setProperty('--pc', p.color);
  $('pdot').style.background = p.color;
  if ($('pname').contentEditable !== 'true') $('pname').textContent = p.name;
  if (document.activeElement !== $('statusText')) $('statusText').value = p.status || '';
  $('statusTime').textContent = p.statusUpdated ? 'обновлено ' + ago(p.statusUpdated) : '';
  autosize($('statusText'));

  const list = data.entries.filter(e => e.projectId === p.id);
  const cnt = (t) => list.filter(e => !e.done && (t === 'all' || e.type === t)).length;
  $('toolbar').innerHTML =
    ['all', 'task', 'idea', 'question'].map(t =>
      `<button class="seg ${filter === t ? 'on' : ''}" data-f="${t}">${t === 'all' ? 'Все' : TYPE[t].label}<i>${cnt(t) || ''}</i></button>`).join('') +
    `<span class="grow"></span><label class="toggle"><input type="checkbox" id="showDone" ${showDone ? 'checked' : ''}> Показать закрытые</label>`;

  let shown = list.filter(e => (filter === 'all' || e.type === filter) && (showDone || !e.done));
  shown.sort((a, b) => (a.done - b.done) || (b.created - a.created));
  $('entries').innerHTML = shown.length ? shown.map(e => `
    <div class="entry ${e.done ? 'done' : ''}" data-id="${e.id}">
      <button class="mark ${e.type}" data-a="toggle" title="${e.done ? 'Вернуть' : 'Закрыть'}">${e.done ? '✓' : TYPE[e.type].mark}</button>
      <div class="text" data-a="text">${esc(e.text)}</div>
      ${filter === 'all' ? `<span class="tag">${TYPE[e.type].one}</span>` : ''}
      <span class="time">${shortTime(e.created)}</span>
      <button class="del" data-a="del" title="Удалить">×</button>
    </div>`).join('')
    : `<div class="empty">${list.length ? 'Тут пусто — всё закрыто 🎉' : 'Пока пусто. Жми ⌘⇧Space из любого места и записывай.'}</div>`;
}

function render() { renderSide(); renderMain(); }
function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }
function select(id) { current = id; filter = 'all'; render(); }

// ---------- events ----------
$('plist').onclick = (e) => { const it = e.target.closest('.pitem'); if (it) select(it.dataset.id); };
$('addProject').onclick = async () => { const id = await window.zk.addProject('Новый проект'); current = id; render(); startRename(); };

$('toolbar').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; renderMain(); } };
$('toolbar').onchange = (e) => { if (e.target.id === 'showDone') { showDone = e.target.checked; renderMain(); } };

let statusTimer;
$('statusText').addEventListener('input', (e) => {
  autosize(e.target);
  clearTimeout(statusTimer);
  const id = current, val = e.target.value;
  statusTimer = setTimeout(() => window.zk.updateProject(id, { status: val }), 500);
});

$('entries').onclick = (e) => {
  const row = e.target.closest('.entry'); if (!row) return;
  const id = row.dataset.id, en = data.entries.find(x => x.id === id);
  const a = e.target.closest('[data-a]')?.dataset.a;
  if (a === 'toggle') window.zk.updateEntry(id, { done: !en.done });
  if (a === 'del') window.zk.deleteEntry(id);
};
$('entries').ondblclick = (e) => {
  const t = e.target.closest('.text'); if (!t) return;
  const id = t.closest('.entry').dataset.id;
  t.contentEditable = 'true'; t.focus();
  document.getSelection().selectAllChildren(t); document.getSelection().collapseToEnd();
  const finish = (save) => {
    t.contentEditable = 'false';
    const v = t.textContent.trim();
    if (save && v) window.zk.updateEntry(id, { text: v }); else renderMain();
  };
  t.onkeydown = (k) => { if (k.key === 'Enter' && !k.shiftKey) { k.preventDefault(); t.blur(); } if (k.key === 'Escape') { t.onblur = null; finish(false); } };
  t.onblur = () => finish(true);
};

$('newText').addEventListener('keydown', async (e) => {
  if (e.key === 'Enter' && !e.isComposing && e.target.value.trim()) {
    await window.zk.addEntry({ projectId: current, type: $('newType').value, text: e.target.value });
    e.target.value = '';
  }
});

$('export').onclick = async () => { await window.zk.exportProject(current); toast('Скопировано — вставь в чат с Claude'); };

function startRename() {
  const h = $('pname'); h.contentEditable = 'true'; h.focus();
  document.getSelection().selectAllChildren(h);
  h.onkeydown = (k) => { if (k.key === 'Enter') { k.preventDefault(); h.blur(); } if (k.key === 'Escape') { h.textContent = proj().name; h.blur(); } };
  h.onblur = () => { h.contentEditable = 'false'; const v = h.textContent.trim(); if (v && v !== proj().name) window.zk.updateProject(current, { name: v }); else h.textContent = proj().name; };
}
$('pname').ondblclick = startRename;

$('more').onclick = (e) => { e.stopPropagation(); $('menu').classList.toggle('show'); };
$('menu').onclick = async (e) => {
  const a = e.target.dataset.a; $('menu').classList.remove('show');
  if (a === 'rename') startRename();
  if (a === 'up' || a === 'down') window.zk.moveProject(current, a === 'up' ? -1 : 1);
  if (a === 'delete') {
    const n = data.entries.filter(x => x.projectId === current).length;
    if (confirm(`Удалить «${proj().name}» и все записи (${n})? Это не отменить.`)) {
      await window.zk.deleteProject(current); current = data.projects[0]?.id; render();
    }
  }
};

$('pdot').onclick = (e) => {
  e.stopPropagation();
  const pal = $('palette'), r = e.target.getBoundingClientRect();
  pal.innerHTML = colors.map(c => `<button style="background:${c}" data-c="${c}"></button>`).join('');
  pal.style.left = r.left + 'px'; pal.style.top = (r.bottom + 8) + 'px';
  pal.classList.add('show');
};
$('palette').onclick = (e) => { const c = e.target.dataset.c; if (c) window.zk.updateProject(current, { color: c }); $('palette').classList.remove('show'); };
document.addEventListener('click', () => { $('menu').classList.remove('show'); $('palette').classList.remove('show'); });

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, [contenteditable="true"]')) return;
  if (e.metaKey && /^[1-9]$/.test(e.key) && data.projects[+e.key - 1]) { e.preventDefault(); select(data.projects[+e.key - 1].id); }
  if (e.key === 'n' || e.key === 'т') { e.preventDefault(); $('newText').focus(); }
});

window.zk.onData((d) => { data = d; if (!proj()) current = data.projects[0]?.id; render(); });
window.zk.onSelectProject(select);
Promise.all([window.zk.getData(), window.zk.getMeta()]).then(([d, m]) => {
  data = d; colors = m.colors; $('hotkey').textContent = m.hotkey;
  current = data.lastProjectId && data.projects.some(p => p.id === data.lastProjectId) ? data.lastProjectId : data.projects[0]?.id;
  render();
});
setInterval(renderMain, 60000);
</script>
</body>
</html>
