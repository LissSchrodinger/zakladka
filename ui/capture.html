<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { color: #E1E8FF; font: 15px/1.45 'Inter Tight', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; }
  .box { border-radius: 20px; padding: 16px 18px 12px; background: rgba(12,14,24,.82); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.06); -webkit-app-region: drag; }
  .row { display: flex; align-items: flex-start; gap: 12px; -webkit-app-region: no-drag; }
  textarea { flex: 1; border: 0; outline: 0; background: transparent; color: #fff; resize: none; font: inherit; font-size: 20px; font-weight: 300; line-height: 1.35; min-height: 30px; max-height: 180px; padding: 2px; user-select: text; }
  textarea::placeholder { color: rgba(225,232,255,.4); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 10px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,.08); -webkit-app-region: no-drag; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 9px; color: rgba(225,232,255,.55); font-size: 13px; }
  .chip.on { background: rgba(255,255,255,.14); color: #fff; }
  .d { width: 6px; height: 6px; border-radius: 50%; }
  .sep { width: 1px; height: 18px; align-self: center; background: rgba(255,255,255,.12); margin: 0 4px; }
  .res { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; -webkit-app-region: no-drag; }
  .res div { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; font-size: 14px; color: rgba(225,232,255,.8); }
  .res div.sel { background: rgba(127,227,232,.14); color: #fff; }
  .res .k { font-size: 11px; color: rgba(225,232,255,.4); width: 56px; }
  .res .m { margin-left: auto; font-size: 12px; color: rgba(225,232,255,.4); }
  .hint { display: flex; gap: 14px; padding-top: 8px; font-size: 11px; color: rgba(225,232,255,.35); }
  .hint b { font-weight: 500; color: rgba(225,232,255,.6); }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="row"><textarea id="input" rows="1" autofocus></textarea></div>
  <div class="res" id="res"></div>
  <div class="chips" id="chips"></div>
  <div class="hint"><span><b>Tab</b> проект</span><span><b>⌘1–6</b> тип</span><span><b>↓</b> найденное</span><span><b>Enter</b> сохранить</span><span><b>⇧Enter</b> строка</span><span><b>Esc</b> закрыть</span></div>
</div>
<script>
const TYPES = [['task', 'Задача', 'Что нужно сделать…'], ['question', 'Вопрос', 'Что спросить или выяснить…'], ['idea', 'Идея', 'Что пришло в голову…'], ['status', 'Где остановилась', 'На чём остановилась и что дальше…'], ['link', 'Ссылка', 'Вставь ссылку'], ['person', 'Человек', 'Имя, роль и @telegram']];
let S, pid, type, sel = -1, matches = [];
const KL = { link: 'ссылка', person: 'человек', task: 'задача', question: 'вопрос', idea: 'идея' };
const input = document.getElementById('input');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render() {
  document.getElementById('chips').innerHTML =
    TYPES.map(([k, l], i) => `<button class="chip ${k === type ? 'on' : ''}" data-t="${k}" title="⌘${i + 1}">${l}</button>`).join('') + '<span class="sep"></span>' +
    S.projects.map((p) => `<button class="chip ${p.id === pid ? 'on' : ''}" data-p="${p.id}"><span class="d" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('');
  input.placeholder = TYPES.find((t) => t[0] === type)[2];
  fit();
}
function fit() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; requestAnimationFrame(() => window.db.resizeCapture(document.getElementById('box').offsetHeight + 2)); }
function setType(t) {
  type = t;
  if (t === 'status' && !input.value.trim()) { const p = S.projects.find((x) => x.id === pid); if (p && p.status) { input.value = p.status; input.select(); } }
  render();
}
function open(s) {
  S = s; pid = S.projects.some((p) => p.id === S.lastProjectId) ? S.lastProjectId : (S.projects[0] || {}).id;
  type = ['status', 'link', 'person'].includes(S.lastType) ? 'task' : (S.lastType || 'task');
  input.value = ''; sel = -1; matches = []; document.getElementById('res').innerHTML = ''; render(); input.focus();
}
document.getElementById('chips').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t) setType(b.dataset.t); if (b.dataset.p) { pid = b.dataset.p; render(); }
  input.focus();
};
function search() {
  const q = input.value.trim().toLowerCase(); const w = q.split(/\s+/).filter(Boolean);
  matches = q.length < 2 || type === 'status' ? [] : S.entries.filter((e) => !e.done || e.type === 'link' || e.type === 'person')
    .filter((e) => w.every((x) => `${e.text} ${e.title || ''}`.toLowerCase().includes(x))).slice(0, 5);
  if (sel >= matches.length) sel = matches.length - 1;
  document.getElementById('res').innerHTML = matches.map((e, i) => { const p = S.projects.find((x) => x.id === e.projectId) || {};
    return `<div class="${i === sel ? 'sel' : ''}"><span class="k">${KL[e.type] || ''}</span>${esc(e.title || e.text).slice(0, 90)}<span class="m">${esc(p.name || '')}</span></div>`; }).join('');
  fit();
}
function openMatch(e) {
  const url = (e.text.match(/https?:\/\/\S+/) || [])[0]; const tg = (e.text.match(/@([A-Za-z0-9_]{4,})/) || [])[1];
  if (e.type === 'link' && url) { window.db.openUrl(url); window.db.closeCapture(); }
  else if (tg && (e.type === 'person' || e.type === 'question')) { window.db.openUrl('tg://resolve?domain=' + tg); window.db.closeCapture(); }
  else window.db.openSearch(input.value.trim());
}
input.addEventListener('input', () => { sel = -1; search(); });
document.addEventListener('keydown', async (e) => {
  if (e.key === 'Escape') return window.db.closeCapture();
  if (e.key === 'Tab') { e.preventDefault(); const i = S.projects.findIndex((p) => p.id === pid), n = S.projects.length; pid = S.projects[(i + (e.shiftKey ? -1 : 1) + n) % n].id; render(); return; }
  if (e.metaKey && /^[1-6]$/.test(e.key)) { e.preventDefault(); setType(TYPES[+e.key - 1][0]); return; }
  if (e.key === 'ArrowDown' && matches.length) { e.preventDefault(); sel = Math.min(sel + 1, matches.length - 1); search(); return; }
  if (e.key === 'ArrowUp' && matches.length) { e.preventDefault(); sel = Math.max(sel - 1, -1); search(); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && sel >= 0 && matches[sel]) { e.preventDefault(); openMatch(matches[sel]); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault(); if (!input.value.trim()) return;
    await window.db.addEntry({ projectId: pid, type, text: input.value }); window.db.closeCapture();
  }
});
window.db.onCaptureOpen(open);
window.db.getState().then(open);
</script>
</body>
</html>
