<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Daybook</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <svg class="noise"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<div class="top">
  <span class="brand">Daybook</span>
  <nav class="nav glass" id="nav" aria-label="Разделы">
    <button data-v="today">Сегодня</button><button data-v="projects">Проекты</button><button data-v="income">Доходы</button>
  </nav>
  <div class="right">
    <button class="upd" id="upd" hidden></button>
    <span id="clock"></span>
    <button class="icon-btn" id="gear" aria-label="Настройки" title="Настройки">⚙︎</button>
  </div>
</div>
<div class="scroll" id="view"></div>
<div class="toast glass" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
